plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autodrive.radiomaroc'
    compileSdk 35
    sourceSets.main.java.srcDir rootProject.file('shared-radio/src/main/java')
    sourceSets.main.java.srcDir rootProject.file('shared-update/src/main/java')

    defaultConfig {
        applicationId 'com.autodrive.radiomaroc'
        minSdk 30
        targetSdk 35
        versionCode providers.gradleProperty('radioMarocVersionCode').getOrElse('31').toInteger()
        versionName providers.gradleProperty('radioMarocVersionName').getOrElse('2.4.3')
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('RADIO_MAROC_KEYSTORE_FILE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('RADIO_MAROC_KEYSTORE_PASSWORD')
                keyAlias 'radio-maroc'
                keyPassword System.getenv('RADIO_MAROC_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
    implementation 'androidx.media3:media3-session:1.8.1'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
