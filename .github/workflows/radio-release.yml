name: Signed Radio Maroc release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore protected signing key
        env:
          SIGNING_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          data = os.environ['SIGNING_DATA']
          if not data:
              raise SystemExit('Signing secret is not configured')
          folder = Path('.release-signing')
          folder.mkdir(mode=0o700)
          key = folder / 'AutoDrive.keystore'
          key.write_bytes(base64.b64decode(data))
          key.chmod(0o600)
          PY
      - name: Check and build signed Radio Maroc APK
        env:
          RADIO_MAROC_KEYSTORE_FILE: ${{ github.workspace }}/.release-signing/AutoDrive.keystore
          RADIO_MAROC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash gradlew :radio-maroc:testDebugUnitTest :radio-maroc:lintDebug :radio-maroc:assembleRelease
      # github_release.py --radio-maroc refuses any APK without the published radio certificate before uploading.
      - name: Publish APK and updater metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/github_release.py --radio-maroc --repository '${{ github.repository }}' \
            --apk radio-maroc/build/outputs/apk/release/radio-maroc-release.apk --output build/radio-publish \
            --commit "$GITHUB_SHA" --notes-file docs/RADIO-MAROC-RELEASE-NOTES.md
      - name: Remove runner signing material
        if: always()
        run: rm -f .release-signing/AutoDrive.keystore
