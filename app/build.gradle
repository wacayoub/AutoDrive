plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.autodrive.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.autodrive.launcher'
        minSdk 33
        targetSdk 35
        versionCode providers.gradleProperty('autodriveVersionCode').getOrElse('17').toInteger()
        versionName providers.gradleProperty('autodriveVersionName').getOrElse('1.5.0')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('AUTODRIVE_KEYSTORE_FILE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('AUTODRIVE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AUTODRIVE_KEY_ALIAS')
                keyPassword System.getenv('AUTODRIVE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
kotlin { jvmToolchain(17) }
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
